<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0E17" />
    <meta name="color-scheme" content="dark light" />
    <meta name="author" content="Qais Alayasa" />
    <!--seo-->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      // Runs before paint: theme, language and the once-per-session intro loader.
      ;(function () {
        var d = document.documentElement, t, l, seen
        try { t = localStorage.getItem('qa-theme'); l = localStorage.getItem('qa-lang'); seen = sessionStorage.getItem('qa-loaded') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        d.setAttribute('data-theme', t)
        if (l === 'ja') d.lang = 'ja'
        var base = '%BASE_URL%', p = location.pathname
        var home = p === base || p === base + 'index.html' || p + '/' === base
        if (home && !seen && !matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('is-loading')
      })()
    </script>
    <style>
      /* Critical: first paint colors + the intro loader (before any CSS bundle loads). */
      html[data-theme='dark'] { background: #0a0e17; color: #e6ebf2; --seal: #4fd1c5; --seal-ink: #042522 }
      html[data-theme='light'] { background: #f6f5f1; color: #13171f; --seal: #0b6b64; --seal-ink: #fff }
      #boot-loader { display: none }
      .is-loading #boot-loader {
        display: grid; place-items: center; position: fixed; inset: 0; z-index: 9999;
        background: inherit; cursor: pointer; transition: opacity .45s ease, visibility .45s;
        animation: boot-out .45s ease 1s forwards; /* dismisses itself even before JS arrives */
      }
      .is-loading.loader-out #boot-loader { opacity: 0; visibility: hidden; animation: none }
      @keyframes boot-out { to { opacity: 0; visibility: hidden } }
      #boot-loader .seal { position: relative; width: 88px; height: 88px; animation: stamp .55s cubic-bezier(.2, 1.4, .4, 1) .1s both }
      #boot-loader .ink {
        position: absolute; inset: -6px; border-radius: 26px; background: var(--seal); filter: blur(10px);
        opacity: 0; animation: ink .7s ease-out .3s both
      }
      @keyframes stamp { from { transform: scale(1.9) rotate(-18deg) } to { transform: scale(1) rotate(-6deg) } }
      @keyframes ink { 0% { opacity: .55; transform: scale(.8) } 100% { opacity: 0; transform: scale(1.9) } }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <div class="seal">
        <span class="ink"></span>
        <svg viewBox="0 0 64 64" width="88" height="88" style="position:relative">
          <rect x="3" y="3" width="58" height="58" rx="16" style="fill:var(--seal)" />
          <rect x="8" y="8" width="48" height="48" rx="11" fill="none" style="stroke:var(--seal-ink)" stroke-opacity=".5" stroke-width="1.5" />
          <text x="32" y="44" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="34" style="fill:var(--seal-ink)">Q</text>
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="max-width:40rem;margin:4rem auto;padding:0 1rem;font-family:system-ui,sans-serif;line-height:1.6">
        <h1>Qais Alayasa</h1>
        <p>I build software where engineering, AI, and product meet. CS at Earlham College, former AI Product Manager intern at Recruit / Indeed in Tokyo.</p>
        <p><a href="https://github.com/kaisalayasa">GitHub</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
